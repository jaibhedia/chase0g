[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

# Public endpoints, hardcoded on purpose: an env var here means forge refuses to
# run at all when it is unset, even for `forge test`. Only secrets belong in .env.
[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"
arc_mainnet = "https://rpc.arc.network"
