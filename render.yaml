# Render Blueprint for the Chase Socket.IO server.
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
services:
  - type: web
    name: chase-dinosaurs
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render injects PORT automatically and the server reads process.env.PORT —
      # do NOT hardcode it here or the health check can't reach the service.
      - key: NODE_ENV
        value: production
      #
      # Comma-separated allowed browser origins (your deployed site URL),
      # e.g. https://chase.example.com — set this in the dashboard once Vercel is live.
      - key: CORS_ORIGIN
        sync: false
      #
      # --- 0G (server-side only) ---
      # Public config is baked in; the two SECRETS are sync:false → enter them
      # in the Render dashboard (never committed): OG_ROUTER_API_KEY + OG_PRIVATE_KEY.
      - key: OG_ROUTER_BASE_URL
        value: https://router-api-testnet.integratenetwork.work/v1
      - key: OG_ROUTER_API_KEY
        sync: false
      - key: OG_MODEL
        value: qwen2.5-omni
      - key: OG_AGENT_TICK_SECONDS
        value: "3.5"
      - key: OG_EVM_RPC
        value: https://evmrpc-testnet.0g.ai
      - key: OG_STORAGE_INDEXER
        value: https://indexer-storage-testnet-turbo.0g.ai
      - key: OG_PRIVATE_KEY
        sync: false
      - key: OG_LEADERBOARD_ADDRESS
        value: "0x1F43588FCb9c99b0539113e2b1C4455e6A9C089C"
